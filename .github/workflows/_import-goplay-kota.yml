name: Import GoPlay Kota website update
on:
  push:
    paths:
      - .github/workflows/_import-goplay-kota.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Download verified archive
        shell: bash
        env:
          ARCHIVE_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3LuBrW73FLi5GmNbWudUHwQff0L/a228ad18-afc7-421d-8b87-177a093d9f37.zip"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "$ARCHIVE_URL" --output /tmp/goplay-update.zip
          echo '49703e82649293b4252902161cdb196a0d1d9dde71ff6c4f269111c8b6b59307  /tmp/goplay-update.zip' | sha256sum -c -
      - name: Validate and extract archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, stat, pathlib
          source = pathlib.Path('/tmp/goplay-update.zip')
          target = pathlib.Path('/tmp/goplay-new')
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(source) as z:
              files = [i for i in z.infolist() if not i.is_dir()]
              assert len(files) == 113, f'Unexpected file count: {len(files)}'
              assert sum(i.file_size for i in files) < 20_000_000
              paths = {i.filename for i in files}
              for name in ('index.html', 'vercel.json', 'assets/js/ball.js', 'assets/img/ball-3d.webp', 'assets/fonts/unbounded-900.woff2'):
                  assert name in paths, f'Missing required file: {name}'
              for item in z.infolist():
                  name = pathlib.PurePosixPath(item.filename)
                  assert not name.is_absolute() and '..' not in name.parts, f'Unsafe entry {name}'
                  assert not item.filename.startswith('.github/'), f'Unexpected workflow in ZIP: {name}'
                  assert not stat.S_ISLNK(item.external_attr >> 16), f'Symlink rejected: {name}'
              z.extractall(target)
          print('Archive validated: 113 site files')
          PY
      - name: Commit updated website
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD^)" != "723c4527877653c0a597140ee9917faf75b81829" ]; then
            echo 'Unexpected starting commit; refusing to overwrite newer work' >&2
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          cp -a /tmp/goplay-new/. .
          git add -A
          test -f assets/js/ball.js
          test -f assets/img/ball-3d.webp
          test -f assets/fonts/unbounded-900.woff2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish GoPlay Kota latest website with 3D ball animation'
          git push origin HEAD:main
